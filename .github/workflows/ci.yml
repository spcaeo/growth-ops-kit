name: ci

# Tests, the demo-site run and the leak check on every push and pull request. No secrets are used or needed.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: Playwright 1.58 does not support Ubuntu 26 yet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the leak check scans every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned add-ons
        run: python -m pip install -r requirements.txt
      - name: Install the headless browser (for the contrast and phone checks on the demo page)
        run: python -m playwright install --with-deps chromium
      - name: Tests (registry, config, CLI, leak check, book, demo site)
        run: python -m pytest tests -q
      - name: Leak check, files now
        run: python kit/tools/leak_check.py
      - name: Leak check, every commit
        run: python kit/tools/leak_check.py --history
